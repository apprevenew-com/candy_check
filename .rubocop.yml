inherit_from: .rubocop_todo.yml

AllCops:
  NewCops: enable
  SuggestExtensions: false
  TargetRubyVersion: 4.0
  Exclude:
    - 'spec/support/*'
    - 'bin/**/*'
    - 'vendor/**/*'
Style/Documentation:
  Enabled: false
Style/FrozenStringLiteralComment:
  Enabled: true
Style/NumericPredicate:
  Enabled: false
Style/OpenStructUse:
  Enabled: true
Style/PercentLiteralDelimiters:
  PreferredDelimiters:
    default: ()
    "%i": ()
    "%w": ()
Metrics/BlockLength:
  Exclude:
    - 'spec/**/*'
Style/Encoding:
  Enabled: false
Style/ExpandPathArguments:
  Enabled: false
Style/SafeNavigation:
  Enabled: false
Style/DateTime:
  Enabled: false
